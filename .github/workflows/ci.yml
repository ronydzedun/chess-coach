name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    name: Rust / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Linux native libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libwayland-dev libxkbcommon-dev libx11-dev libxcursor-dev libxi-dev libxrandr-dev libxkbcommon-x11-0 stockfish
      - name: Toolchain
        run: rustup show
      - name: Format
        run: cargo fmt --all -- --check
      - name: Build
        run: cargo build --workspace --all-targets --locked
      - name: Tests
        run: cargo test --workspace --locked
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Real engine tests
        if: runner.os == 'Linux'
        env:
          STOCKFISH_EXECUTABLE: /usr/games/stockfish
        run: cargo test -p engine --locked -- --nocapture
  licenses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - run: rustup show
      - run: python3 scripts/dependency_inventory.py --check
      - run: cargo install cargo-deny --version 0.20.2 --locked
      - run: cargo deny --locked check licenses
