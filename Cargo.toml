[workspace]
members = ["crates/chess-core", "crates/engine", "crates/desktop", "crates/library"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "GPL-3.0-or-later"

[workspace.dependencies]
shakmaty = "0.30.2"
iced = { version = "0.14.0", default-features = false, features = ["tiny-skia", "tokio", "x11", "wayland", "svg", "advanced"] }

# Keep CPU rendering responsive in debug runs without optimizing application code.
# Debug assertions and overflow checks retain the dev-profile defaults.
[profile.dev.package.tiny-skia]
opt-level = 2

[profile.dev.package.tiny-skia-path]
opt-level = 2

[profile.dev.package.iced_tiny_skia]
opt-level = 2
